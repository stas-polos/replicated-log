master:
  port: 4000

secondaries:
  - url: http://secondary1:3001
    name: secondary1
    delay: 0
  - url: http://secondary2:3002
    name: secondary2
    delay: 5000

replication:
  secondaryDelay: 10000
  timeout: 5000
  retryDelays: [1000, 2000, 4000, 8000, 16000, 30000]

heartbeat:
  interval: 5000
  suspectedThreshold: 2
  unhealthyThreshold: 4

quorum:
  enabled: true
  requiredPercentage: 0.5
